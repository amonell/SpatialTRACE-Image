[project]
name = "tissuemapper-image"
version = "1.0.0rc1"
description = "Shared-scale representation-pretrained image models for intestinal anatomy."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = [
    "h5py>=3.8",
    "imagecodecs>=2024.1.1",
    "matplotlib>=3.7,<4",
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "pillow>=10",
    "pyarrow>=16",
    "pyyaml>=6",
    "scipy>=1.11",
    "scikit-learn>=1.4,<2",
    "torch==2.12.1",
    "tifffile>=2024.1",
    "zarr>=3,<4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cpu = ["torch==2.12.1"]
cu126 = ["torch==2.12.1"]
dev = ["pytest>=8", "build>=1", "ruff>=0.12"]
docs = ["mkdocs>=1.6"]
figures = ["pypdf>=6", "reportlab>=4", "pymupdf>=1.26", "seaborn>=0.13", "statsmodels>=0.14", "pyarrow>=16", "pillow>=10"]
embedding = ["umap-learn>=0.5", "numba>=0.61", "llvmlite>=0.44"]

[project.scripts]
tissuemapper-image = "crypt_villus_vit.cli:main"
crypt-villus-vit = "crypt_villus_vit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypt_villus_vit = ["artifacts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
